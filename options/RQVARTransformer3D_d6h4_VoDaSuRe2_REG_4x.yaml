defaults:
  - train_opt: train_VoDaSuRe          # Default training config
  - dataset_opt: VoDaSuRe_OME          # Default dataset config
  - model_opt: RQVARTransformer3D_d6h4_cvae64                  # Default model config
  - _self_  # Ensure compliance with Hydra 1.1

# Main configuration
task: superresolution
input_type: 3D # Input type, 2D or 3D
up_factor: 4  # upscaling factor
vae_target: HR  # Autoencoder training mode: HR (HR->HR) or LR (LR->LR)

# Profile & Compile
run_profile: false
compile: true # Enable PyTorch 2.0 compilation
compile_mode: max-autotune-no-cudagraphs  # default, reduce-overhead, max-autotune, max-autotune-no-cudagraphs

# WandB parameters
wandb_mode: online  # remember to set to "online" for actual training runs
wandb_entity: null
wandb_project: ${dataset_opt.name}_V2_REG_${up_factor}x # <--- change project
experiment_id: ${model_opt.model_architecture}_${dataset_opt.name}_V2_ID000000
run_name: ${model_opt.model_architecture}_000_d6h4_warmup
note: Note

# GPU configuration
train_mode: "scratch"   # "scratch", "finetune" or "resume"
gpu_ids: [0]
dist: false
cluster: DTU_HPC # DTU_HPC or TITANS

save_model: true  # flag to save model
save_time: 70  # Backup save of model after 35 hours

path:
  root: superresolution
  pretrained_experiment_id: null
  pretrained_netE: null

  # pretrained_hr_vqmodel_id: RMSVQVAE3D_VoDaSuRe2_64_VoDaSuRe_OME_ID000010  # VQ model with Cvae=512, ~50% usage
  # pretrained_hr_vqmodel_id: RMSVQVAE3D_VoDaSuRe2_64_VoDaSuRe_OME_ID000035  # VQ model with Cvae=64, znorm=True and ~95% usage
  # pretrained_hr_vqmodel_id: RMSVQVAE3D_VoDaSuRe2_64_VoDaSuRe_OME_ID000045  # VQ model with Cvae=64, znorm=False and ~80% usage
  pretrained_hr_vqmodel_id: RMSVQVAE3D_VoDaSuRe2_64_VoDaSuRe_OME_ID000055  # VQ model with Cvae=64, znorm=True and ~95% usage (better recon performance than ID000035)

# Overwrite default training parameters
train_opt:
  iterations: 100000
  validation_iterations: 50
  checkpoint_test: 2500
  checkpoint_save: 1000000
  checkpoint_print: 2500
  checkpoint_save_visuals: 2500
  num_accum_steps_G: 1

  # Now matches RQTransformer papers hyperparameters
  G_optimizer_type: adamw
  G_optimizer_lr: 5e-4
  G_optimizer_wd: 0.0001
  G_optimizer_clipgrad: 4
  G_optimizer_betas: [0.9, 0.95]
  G_scheduler_type: CosineAnnealingLR
  G_warmup_steps: 2500

  # disable recon loss weights, transformer is trained with CE loss only
  G_loss_weights:
    L1: 0
    LPIPS: 0

  manual_seed: 8800 # 8400

# Overwrite default dataset parameters
dataset_opt:
  synthetic: false
  patch_size: 16

  datasets: [VoDaSuRe2]

  train_dataloader_params:
    dataloader_batch_size: 16
    num_load_workers: 16
    persist_workers: true
    pin_memory: false

  test_dataloader_params:
    dataloader_batch_size: 4
    num_load_workers: 4
    persist_workers: true
    pin_memory: false

# Hydra configuration
hydra:
  run:
    dir: .  # Prevents Hydra from changing the working directory
  job:
    chdir: False  # Prevents changing working directory
  output_subdir: null  # Prevents automatic output directory creation
  sweep:
    dir: .  # Keeps sweep results in the current directory
  job_logging:
    disable_existing_loggers: False  # Allows you to control logging manually

#config_path: ${hydra:runtime.config_sources}
