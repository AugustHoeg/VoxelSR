## @package _global_ # remove first # to enable merging into top-level namespace
# OSEDiff 2D SR baseline.
#
model: osediff
model_architecture: OSEDiff
netG:
  net_type: OSEDiff
  description: "OSEDiff (2D)"

  pretrained_model_name_or_path: Manojb/stable-diffusion-2-1-base
  lora_rank: 4
  cfg_vsd: 7.5  # 7.5
  use_tiled_vae: false
  merge_and_unload_lora: false

  add_decoder_lora: true  # Adds LoRA adapters to the decoder of the VAE.

  lambda_vsd: 1.0  # 1.0
  lambda_vsd_lora: 1.0

  sample_names_as_prompt: true  # Use sample names as prompts for training.
  prompt: "Micro-CT scan"  # Generic fixed prompt, used if use_sample_prompt is false.
  neg_prompt: "painting, oil painting, illustration, drawing, art, sketch, cartoon, CG Style, 3D render, unreal engine, blurring, dirty, messy, worst quality, low quality, frames, watermark, signature, jpeg artifacts, deformed, lowres, over-smooth"

  init_type: default
  init_bn_type: uniform
  init_gain: 0.2

