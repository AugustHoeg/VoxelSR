## @package _global_ # remove first # to enable merging into top-level namespace

model: varsr
model_architecture: VARSR
netG:
  net_type: VARSR
  description: "VARSR"
  in_channels: 3                 # grayscale; set 3 only for loading pretrained weights from 3-channel model
  vocab_size: 4096           # codebook size V (VARSR: 4096)
  z_channels: 32                 # latent / codebook vector dim Cvae (VARSR: 32)

  depth: 24                      # number of transformer blocks (VARSR: 24)
  shared_aln: false
  attn_l2_norm: true
  fuse: false

  # weight initalization
  init_adaln_gamma: 1e-4
  init_adaln: 0.5
  init_head: 0.02
  init_std: -1

  flash_if_available: true
  fused_if_available: true

  # optimization
  tblr: 5e-5  # base lr
  wpe: 0.01  #
  twd: 0.05
  # grad_clip: 2
  # adamw

  v_patch_nums: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16]
  control_patch_nums: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16]

  label_B_flag: false  # disable label_B for VARSR; only used for 2D datasets

  init_type: default             # encoder/decoder self-initialize; keep 'default'
  init_bn_type: uniform
  init_gain: 0.2
