## @package _global_ # remove first # to enable merging into top-level namespace
model: vqvae
model_architecture: VARVQVAE3D
netG:
  net_type: VARVQVAE3D
  description: "3D Multi-scale VQVAE (VARVQVAE3D)"
  in_channels: 1
  channels_enc: [64, 64, 256, 512, 512]
  channels_dec: [512, 512, 256, 64, 64]
  num_res_blocks_enc: 2
  num_res_blocks_dec: 4
  latent_dim: 768
  quant_embed_dim: 768
  num_embeddings: 4096

  v_patch_nums : [1, 2, 3, 4, 6, 8]   # -> 828 tokens per volume
  quant_resi: 0.5
  share_quant_resi: 4
  using_znorm: true
  eini: 0.1

  attn_resolutions: [8]
  skip_attn: false
  use_checkpoint: true

  init_type: default
  init_bn_type: uniform  # "uniform" | "constant"
  init_gain: 0.2
