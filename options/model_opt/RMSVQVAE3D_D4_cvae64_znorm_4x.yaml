## @package _global_ # remove first # to enable merging into top-level namespace
model: vqvae
model_architecture: RMSVQVAE3D
netG:
  net_type: RMSVQVAE3D
  description: "3D Multi-scale VQVAE (MSVQVAE3D)"
  in_channels: 1
  channels_enc: [64, 256, 512, 512]
  channels_dec: [512, 512, 256, 64]
  num_res_blocks_enc: 2
  num_res_blocks_dec: 4
  latent_dim: 64  # Reduced from 512 to 64 to increase codebook usage
  quant_embed_dim: 64  # Reduced from 512 to 64 to increase codebook usage
  num_embeddings: 4096

  v_patch_nums : [1, 2, 3, 4, 5, 6, 8]   # -> 953 tokens per volume
  quant_resi: 0.5
  use_prog_quant_resi: true  # use progressive Phi upsampling
  using_znorm: true  # normalize latent features before quantization
  n_rq_depth: 4

  # Scale and depth dropout
  use_stochastic_depth: true
  scale_drop_rate: 0.10
  depth_drop_rate: 0.0
  keep_last_quant: true
  keep_first_quant: false
  lambda_vq_depth: 0.0 # Disable RQVAE-style commitment loss for within-scale depth quantization (default: 0.0, disabled)

  decay: 0.99  # EMA decay for codebook updates
  restart_unused_codes: true
  restart_clamp_factor: 1.0
  skip_update_over: null  # skip codebook update if vector magnitude is above this threshold

  attn_resolutions: [8]
  skip_attn: false
  use_checkpoint: true

  init_type: default
  init_bn_type: uniform  # "uniform" | "constant"
  init_gain: 0.2
