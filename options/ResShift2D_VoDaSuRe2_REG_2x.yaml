defaults:
  - train_opt: train_VoDaSuRe          # Default training config
  - dataset_opt: VoDaSuRe_OME       # Default dataset config
  - model_opt: ResShift2D              # Default model config
  - _self_  # Ensure compliance with Hydra 1.1

# Main configuration
task: superresolution
input_type: 2D # Input type, 2D or 3D
up_factor: 2  # upscaling factor
vae_target: HR  # Autoencoder training mode: HR (HR->HR) or LR (LR->LR)

# Profile & Compile
run_profile: false
compile: true # Enable PyTorch 2.0 compilation
compile_mode: max-autotune-no-cudagraphs  # default, reduce-overhead, max-autotune, max-autotune-no-cudagraphs

# WandB parameters
wandb_mode: online
wandb_entity: null
wandb_project: ${dataset_opt.name}_V2_REG_${up_factor}x # <--- change project
experiment_id: ${model_opt.model_architecture}_${dataset_opt.name}_V2_ID000000
run_name: ${model_opt.model_architecture}_000
note: Note

# GPU configuration
train_mode: "scratch"   # "scratch", "finetune" or "resume"
gpu_ids: [0]
dist: false
cluster: DTU_HPC # DTU_HPC or TITANS

save_model: true  # flag to save model
save_time: 36  # Backup save of model after 35 hours

path:
  root: superresolution
  pretrained_experiment_id: null
  pretrained_netE: null

# Overwrite default training parameters
train_opt:
  iterations: 100000
  validation_iterations: 50
  checkpoint_test: 2500
  checkpoint_save: 20000
  checkpoint_print: 2500
  checkpoint_save_visuals: 2500
  num_accum_steps_G: 1

  # ResShift2D hyperparameters
  G_optimizer_type: adam
  G_optimizer_lr: 5e-5
  G_optimizer_wd: 0
  G_optimizer_clipgrad: 10
  G_optimizer_betas: [0.9, 0.999]
  G_scheduler_type: CosineAnnealingLR
  G_eta_min: 2e-5
  G_warmup_steps: 5000

  # ResShift2D relies on MSE loss in noise space, so loss weights are set to 0
  G_loss_weights:
    L1: 0
    LPIPS: 0

  manual_seed: 8800 # 8400

# Overwrite default dataset parameters
dataset_opt:
  synthetic: false
  patch_size: 32  # --> patch_size_hr = 64

  datasets: [VoDaSuRe2] # [HCP_1200, IXI, LITS, LIDC-IDRI, CTSpine1K, VoDaSuRe]

  # Diffusion process of ResShift assumes inputs are normalized to [-1, 1]
  norm_type: znormalization  # scale_intensity

  train_dataloader_params:
    dataloader_batch_size: 16
    num_load_workers: 32
    persist_workers: true
    pin_memory: false

  test_dataloader_params:
    dataloader_batch_size: 4
    num_load_workers: 4
    persist_workers: true
    pin_memory: false

# Hydra configuration
hydra:
  run:
    dir: .  # Prevents Hydra from changing the working directory
  job:
    chdir: False  # Prevents changing working directory
  output_subdir: null  # Prevents automatic output directory creation
  sweep:
    dir: .  # Keeps sweep results in the current directory
  job_logging:
    disable_existing_loggers: False  # Allows you to control logging manually

#config_path: ${hydra:runtime.config_sources}
